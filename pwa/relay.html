<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCP Relay</title>
<style>
  body { background: #060a10; color: #63b4ff; font-family: monospace;
         padding: 20px; font-size: 12px; }
  #log { margin-top: 20px; }
  .log-line      { margin: 1px 0; }
  .log-line.ok   { color: #1d9e75; }
  .log-line.err  { color: #ff6b6b; }
  .log-line.info { color: #63b4ff; }
  .log-line.warn { color: #f0a500; }
</style>
</head>
<body>
<div id="status">Initializing...</div>
<div id="log"></div>

<audio id="remote-audio" autoplay playsinline></audio>

<script>
const log = (msg, type='info') => {
  console.log('[RELAY-' + type.toUpperCase() + '] ' + msg);

  const el = document.getElementById('log');
  if (el) {
    const d = document.createElement('div');
    d.className = 'log-line ' + type;
    const time = new Date().toLocaleTimeString('en', {hour12: false});
    d.textContent = time + '  ' + msg;
    el.appendChild(d);
    el.scrollTop = el.scrollHeight;
    while (el.children.length > 100) el.removeChild(el.firstChild);
  }

  try {
    fetch('https://opencall-server-pqfe.onrender.com/relay-log', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        t: new Date().toISOString(),
        type: type,
        msg: msg,
        callId: currentCallId || null,
        ua: navigator.userAgent.slice(0, 50)
      })
    }).catch(() => {});
  } catch(e) {}

  if (window.AndroidRelay) {
    try { window.AndroidRelay.onLog('[' + type + '] ' + msg); } catch(e) {}
  }
};

let ws = null;
let pc = null;
let micStream = null;
let currentCallId = null;
let serverUrl = 'wss://opencall-server-pqfe.onrender.com';
let relayMode = 'both';
let relayCountry = 'IN';
let relayNumber = '';
let ocpAddress = 'relay_' + Date.now();

// FIX 1 — dual-rate ping intervals
let normalPingInterval = null;
let activePingInterval = null;

// FIX 5 — ICE candidate buffer for WS-down periods
let pendingIceCandidates = [];

function startNormalPing() {
  if (normalPingInterval) clearInterval(normalPingInterval);
  normalPingInterval = setInterval(() => {
    if (ws && ws.readyState === 1) {
      try { ws.send(JSON.stringify({ type: 'ping', t: Date.now() })); } catch(e) {}
    }
  }, 2000);
}

function startAggressivePing() {
  if (activePingInterval) clearInterval(activePingInterval);
  activePingInterval = setInterval(() => {
    if (ws && ws.readyState === 1) {
      try { ws.send(JSON.stringify({ type: 'ping', t: Date.now() })); } catch(e) {}
    }
  }, 500);
}

function stopAggressivePing() {
  if (activePingInterval) clearInterval(activePingInterval);
  activePingInterval = null;
}

// FIX 4 — screen wake lock to prevent WebView suspension
async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      const wakeLock = await navigator.wakeLock.request('screen');
      log('🔒 Wake lock acquired', 'ok');
      wakeLock.addEventListener('release', () => {
        log('🔓 Wake lock released', 'warn');
      });
      return wakeLock;
    }
  } catch(e) {
    log('Wake lock not available: ' + e.message, 'warn');
  }
  return null;
}

function initRelay(server, country, number, mode) {
  log('=== RELAY INIT ===', 'ok');
  log('server: ' + server, 'info');
  log('country: ' + country, 'info');
  log('number: ' + number, 'info');
  log('mode: ' + mode, 'info');
  serverUrl = server || serverUrl;
  relayCountry = country || 'IN';
  relayNumber = number || '';
  relayMode = mode || 'both';
  ocpAddress = 'relay_' + Date.now() + '_' + country;
  connect();
}

function connect() {
  log('Connecting to ' + serverUrl);
  ws = new WebSocket(serverUrl);

  ws.onopen = () => {
    log('✅ WebSocket connected to signal server', 'ok');
    log('  url: ' + serverUrl, 'info');
    document.getElementById('status').textContent = '🟢 Connected';

    // FIX 1 — start normal-rate keepalive
    startNormalPing();

    send({
      type: 'register_relay',
      country: relayCountry,
      relay_mode: relayMode,
      ocp_address: ocpAddress,
      number: relayNumber,
      capacity: 3
    });

    // FIX 5 — flush any ICE candidates buffered while WS was down
    setTimeout(() => {
      if (pendingIceCandidates.length > 0) {
        log('📤 Flushing ' + pendingIceCandidates.length + ' buffered ICE candidates', 'warn');
        pendingIceCandidates.forEach(ice => {
          if (ws && ws.readyState === 1) ws.send(JSON.stringify(ice));
        });
        pendingIceCandidates = [];
      }
    }, 1000);
  };

  ws.onclose = (e) => {
    // FIX 1 — stop both ping intervals
    if (normalPingInterval) { clearInterval(normalPingInterval); normalPingInterval = null; }
    stopAggressivePing();
    log('❌ WebSocket closed', 'err');
    log('  code: ' + e.code + ' reason: ' + (e.reason || 'none'), 'err');
    log('Reconnecting in 3 seconds...', 'warn');
    document.getElementById('status').textContent = '🔴 Disconnected';
    setTimeout(connect, 3000);
  };

  ws.onerror = (e) => {
    log('❌ WebSocket ERROR', 'err');
  };

  ws.onmessage = async (e) => {
    const msg = JSON.parse(e.data);
    log('← ' + msg.type);

    switch(msg.type) {

      case 'relay_registered':
        log('✅ Registered as relay node', 'ok');
        log('  country: ' + relayCountry, 'ok');
        log('  number: ' + relayNumber, 'ok');
        log('  mode: ' + relayMode, 'ok');
        log('  ocp: ' + ocpAddress, 'ok');
        document.getElementById('status').textContent = '✅ Relay active';
        if (window.AndroidRelay) window.AndroidRelay.onRegistered();
        break;

      case 'relay_call':
        currentCallId = msg.callId;
        log('📞 relay_call received', 'ok');
        log('  dialNumber: ' + msg.dialNumber, 'ok');
        log('  callId: ' + msg.callId, 'ok');
        log('  callerIdToShow: ' + (msg.callerIdToShow || 'none'), 'info');
        // FIX 2 — aggressive ping immediately; Android will throttle WS when GSM starts
        requestWakeLock();
        startAggressivePing();
        log('🏓 Aggressive ping started (500ms)', 'info');
        if (window.AndroidRelay) {
          window.AndroidRelay.onRelayCall(
            msg.dialNumber,
            msg.callId,
            msg.callerIdToShow || ''
          );
        }
        break;

      case 'relay_sms':
        log('💬 relay_sms: ' + msg.targetNumber);
        if (window.AndroidRelay) {
          window.AndroidRelay.onRelaySMS(
            msg.targetNumber,
            msg.joinURL,
            msg.callId
          );
        }
        break;

      case 'start_webrtc':
        currentCallId = msg.callId;
        log('🎙️ start_webrtc received', 'ok');
        log('  callId: ' + msg.callId, 'ok');
        await setupPeerConnection(msg.callId);
        break;

      case 'sdp_offer':
        log('📨 sdp_offer received', 'ok');
        log('  sdp length: ' + (msg.sdp?.sdp?.length || 0), 'info');
        await handleOffer(msg);
        break;

      case 'ice':
        log('🧊 ICE candidate received from A', 'info');
        if (pc && msg.candidate) {
          try {
            await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
          } catch(e) { log('ICE add failed: ' + e.message, 'err'); }
        }
        break;

      case 'relay_hangup':
        log('📴 Hangup from server');
        cleanup();
        if (window.AndroidRelay) window.AndroidRelay.onHangup();
        break;
    }
  };
}

async function setupPeerConnection(callId) {
  try {
    log('Creating RTCPeerConnection...', 'info');
    pc = new RTCPeerConnection({
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        {
          urls: 'turn:openrelay.metered.ca:80',
          username: 'openrelayproject',
          credential: 'openrelayproject'
        },
        {
          urls: 'turn:openrelay.metered.ca:443',
          username: 'openrelayproject',
          credential: 'openrelayproject'
        },
        {
          urls: 'turn:openrelay.metered.ca:443?transport=tcp',
          username: 'openrelayproject',
          credential: 'openrelayproject'
        }
      ]
    });
    log('✅ RTCPeerConnection created', 'ok');

    // FIX 5 — buffer ICE candidates when WS is not ready
    pc.onicecandidate = (e) => {
      if (e.candidate) {
        const iceMsg = { type: 'ice', callId, candidate: e.candidate.toJSON() };
        if (ws && ws.readyState === 1) {
          ws.send(JSON.stringify(iceMsg));
          log('🧊 Sending ICE candidate to A', 'info');
        } else {
          pendingIceCandidates.push(iceMsg);
          log('🧊 ICE buffered (WS not ready)', 'warn');
        }
      }
    };

    // FIX 3 — stop aggressive ping once ICE connects; add disconnected handler
    pc.oniceconnectionstatechange = () => {
      log('ICE state changed: ' + pc.iceConnectionState,
        pc.iceConnectionState === 'connected' ? 'ok' : 'info');
      if (pc.iceConnectionState === 'connected') {
        log('✅ WebRTC connected — audio bridge live!', 'ok');
        stopAggressivePing();
        startNormalPing();
        log('🏓 Back to normal ping rate', 'info');
        document.getElementById('status').textContent = '✅ Call bridging';
        if (window.AndroidRelay) window.AndroidRelay.onWebRTCConnected();
      }
      if (pc.iceConnectionState === 'failed') {
        log('❌ ICE failed — restarting', 'err');
        pc.restartIce();
      }
      if (pc.iceConnectionState === 'disconnected') {
        log('⚠️ ICE disconnected — attempting restart', 'warn');
        setTimeout(() => {
          if (pc && pc.iceConnectionState === 'disconnected') {
            pc.restartIce();
          }
        }, 2000);
      }
    };

    pc.ontrack = (e) => {
      log('✅ Audio track received from A!', 'ok');
      log('  stream id: ' + (e.streams[0]?.id || 'none'), 'info');
      const audio = document.getElementById('remote-audio');
      audio.srcObject = e.streams[0];
    };

    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false,
          sampleRate: 16000
        }
      });
      log('✅ Microphone access granted', 'ok');
      log('  tracks: ' + micStream.getTracks().length, 'info');
      micStream.getTracks().forEach(t => pc.addTrack(t, micStream));
    } catch(e) {
      log('❌ Microphone FAILED: ' + e.message, 'err');
      log('  This means relay cannot capture audio', 'err');
    }

    log('Peer connection ready — waiting for offer');

  } catch(e) {
    log('setupPeerConnection crash: ' + e.message, 'err');
  }
}

async function handleOffer(msg) {
  try {
    if (!pc) {
      log('No PC yet — setting up first');
      await setupPeerConnection(msg.callId);
    }

    log('handleOffer: setting remote description...', 'info');
    await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
    log('✅ Remote SDP set successfully', 'ok');

    const answer = await pc.createAnswer();
    log('✅ Answer created', 'ok');

    await pc.setLocalDescription(answer);
    log('✅ Local SDP set', 'ok');

    send({
      type: 'sdp_answer',
      callId: msg.callId,
      sdp: { type: answer.type, sdp: answer.sdp }
    });
    log('✅ SDP answer sent to server', 'ok');

  } catch(e) {
    log('❌ handleOffer CRASHED: ' + e.message, 'err');
    log('  stack: ' + (e.stack || 'none').slice(0, 100), 'err');
    console.error(e);
  }
}

function cleanup() {
  log('🧹 cleanup() called', 'info');
  stopAggressivePing();
  pendingIceCandidates = [];
  try {
    pc?.close();
    log('PeerConnection closed', 'info');
    pc = null;
  } catch(e) { log('PC close error: ' + e.message, 'err'); }
  try {
    micStream?.getTracks().forEach(t => t.stop());
    log('Mic tracks stopped', 'info');
    micStream = null;
  } catch(e) { log('Mic stop error: ' + e.message, 'err'); }
  currentCallId = null;
  log('✅ Cleanup complete', 'ok');
}

function onGSMConnected(callId) {
  log('📞 onGSMConnected called. callId: ' + callId, 'ok');
  log('Sending relay_ready to server...', 'info');
  send({ type: 'relay_ready', callId, status: 'connected' });
  log('✅ relay_ready sent', 'ok');
}

function onGSMEnded(callId) {
  log('📴 onGSMEnded called. callId: ' + callId, 'info');
  send({ type: 'relay_call_ended', callId });
  log('relay_call_ended sent', 'info');
  cleanup();
  log('Cleaned up', 'info');
}

function onSMSSent(callId, status) {
  send({ type: 'sms_sent', callId, status });
}

function send(obj) {
  if (ws && ws.readyState === 1) {
    ws.send(JSON.stringify(obj));
    log('→ ' + obj.type);
  }
}
</script>
</body>
</html>
